aid: briya
name: Briya
description: >-
  Briya builds AIRE (AI Research Environment), a privacy-first AI platform for
  healthcare and clinical research that lets researchers analyze real-world
  medical data without writing code. AIRE trains AI models on real-world data
  and provides domain-specific agents for literature review, hypothesis testing,
  population and cohort analysis, study design, and manuscript-ready output with
  built-in validation. Data is accessed across multiple sources without
  centralizing it into a warehouse, with a compliance posture aimed at HIPAA,
  GDPR, and FDA/EMA regulatory standards. Briya serves emerging biotech, life
  sciences organizations, academic institutions, and healthcare systems, with
  offices in New York, Nashville, and Tel Aviv. The company is backed by Insight
  Partners. This API Evangelist profile is an enrichment pass on a portfolio
  lead; Briya publishes no public developer API surface at this time.
